<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!-- รองรับภาษาไทย -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- รองรับมือถือ -->
    <title>Form Center</title>

    <style>
        /* เรียกใช้ฟอนต์ Prompt จาก Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Prompt&display=swap');

        body {
            font-family: 'Prompt', sans-serif; /* ฟอนต์หลักของเว็บ */
            margin: 0;              /* ตัดขอบรอบหน้าเว็บ */
            height: 100vh;          /* สูงเต็มหน้าจอ */

            display: flex;          /* ใช้ Flexbox */
            justify-content: flex-end; /* ดันฟอร์มไปด้านขวา */
            align-items: center;    /* จัดกึ่งกลางแนวตั้ง */

            padding-right: 120px;   /* เว้นระยะจากขอบขวา */

            /* ตั้งค่าพื้นหลังเป็นรูป */
            background-image: url("pic/Backgroundenter.png"); /* รูปพื้นหลัง */
            background-size: cover;        /* ขยายเต็มจอ */
            background-position: center;   /* จัดรูปให้อยู่กลาง */
            background-repeat: no-repeat;  /* ไม่ให้รูปซ้ำ */
        }

        /* กล่องฟอร์ม */
        form {
            background: rgba(255,255,255,0.95); /* สีขาวโปร่งเล็กน้อย */
            padding: 30px 35px;   /* ระยะห่างด้านใน */
            width: 420px;         /* ความกว้างฟอร์ม */

            border-radius: 20px;  /* ทำมุมโค้ง */
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); /* เงา */
        }

        /* แต่ละแถวของฟอร์ม */
        .row {
            margin-bottom: 15px; /* เว้นระยะด้านล่าง */
        }

        /* ป้ายชื่อช่อง */
        label {
            display: inline-block; /* จัดให้อยู่บรรทัดเดียวกัน */
            width: 140px;          /* ความกว้าง label */
            font-weight: 500;      /* ตัวหนานิด ๆ */
        }

        /* ช่องกรอกข้อมูล */
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="number"] {
            width: 200px;          /* ความกว้างช่องกรอก */
            padding: 8px 12px;     /* ระยะด้านใน */

            border-radius: 12px;   /* ทำช่องให้มน */
            border: 1px solid #ccc;
            outline: none;

            font-family: 'Prompt', sans-serif;
        }

        /* เอฟเฟกต์เมื่อคลิกช่องกรอก */
        input:focus {
            border-color: #d87c9a; /* เปลี่ยนเป็นสีชมพู */
        }

        /* ปุ่ม Submit */
        .submit-btn {
            width: 100%;           /* เต็มความกว้างฟอร์ม */
            padding: 12px;
            margin-top: 10px;

            font-size: 16px;
            font-weight: 500;

            border: none;
            border-radius: 25px;   /* ปุ่มมน */
            cursor: pointer;

            background-color: #d87c9a; /* สีชมพู */
            color: #fff;
        }

        /* เอฟเฟกต์เมื่อชี้เมาส์ */
        .submit-btn:hover {
            background-color: #c56786; /* ชมพูเข้มขึ้น */
        }

        /* เครื่องหมาย * สีแดง */
        .required {
            color: red;
        }
    </style>
</head>

<body>

<form>
    <div class="row">
        <label>Name :</label>
        <input type="text" placeholder="พิมพ์ชื่อ">
        <span class="required">*</span>
    </div>

    <div class="row">
        <label>Surname :</label>
        <input type="text">
        <span class="required">*</span>
    </div>

    <div class="row">
        <label>Date of birth :</label>
        <input type="date">
    </div>

    <div class="row">
        <label>Age :</label>
        <input type="number">
    </div>

    <div class="row">
        <label>Gender :</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
    </div>

    <div class="row">
        <label>Email :</label>
        <input type="email" placeholder="Enter email address">
        <span class="required">*</span>
    </div>

    <div class="row">
        <input type="checkbox"> ข้อมูลถูกต้อง
    </div>

    <div class="row">
        <label>Password :</label>
        <input type="password">
    </div>

    <div class="row">
        <label>Confirm Password :</label>
        <input type="password">
    </div>

    <input class="submit-btn" type="submit" value="Submit">
</form>

</body>
</html>
