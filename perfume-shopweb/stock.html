<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolly Perfume | Stock</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Prompt',sans-serif;
    background:#f9e7e4;
    color:#111;
}
header{
    padding:25px 100px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.logo img{height:60px;}
nav a{
    margin-left:45px;
    text-decoration:none;
    color:#111;
    letter-spacing:2px;
    font-size:14px;
}
.stock-section{
    padding:120px;
    background:#fff;
}
.stock-title{
    text-align:center;
    margin-bottom:60px;
}
.stock-title h2{
    font-size:42px;
    font-weight:300;
    letter-spacing:6px;
}
table{
    width:100%;
    max-width:1000px;
    margin:auto;
    border-collapse:collapse;
}
th,td{
    padding:18px 20px;
    border-bottom:1px solid #ddd;
}
th{
    background:#f3d6db;
    letter-spacing:2px;
    font-weight:400;
}
td:nth-child(1){text-align:center;color:#999;}
td:nth-child(3),td:nth-child(4){text-align:right;}
td:nth-child(5){text-align:center;}
.stock{font-weight:600}
.add-btn{
    padding:8px 25px;
    border:1px solid #111;
    background:transparent;
    cursor:pointer;
    letter-spacing:2px;
}
.add-btn:hover{
    background:#111;
    color:#fff;
}
.cart-summary{
    max-width:1000px;
    margin:60px auto 0;
    padding:40px;
    background:#f3d6db;
}
.cart-summary h3{
    margin-bottom:30px;
    letter-spacing:3px;
    font-weight:400;
}
.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:12px;
}
.grand-total{
    margin-top:20px;
    font-size:22px;
    font-weight:600;
}
.checkout-btn{
    width:100%;
    margin-top:30px;
    padding:15px;
    border:none;
    background:#111;
    color:#fff;
    font-size:18px;
    letter-spacing:3px;
    cursor:pointer;
}
footer{
    background:#111;
    color:#fff;
    padding:80px 120px;
    margin-top:120px;
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <img src="pic/logo-removebg-preview.png" alt="Dolly Perfume">
    </div>
    <nav>
        <a href="#">HOME</a>
        <a href="#">ABOUT</a>
        <a href="#">REGISTER</a>
    </nav>
</header>

<section class="stock-section">
    <div class="stock-title">
        <h2>PERFUME STOCK</h2>
    </div>

    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Product</th>
                <th>Price ($)</th>
                <th>Stock</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="stock-list">
            <!-- JS ใส่สินค้าให้ -->
        </tbody>
    </table>

    <div class="cart-summary">
        <h3>ORDER SUMMARY</h3>

        <div class="summary-row">
            <span>Total Items</span>
            <span id="sum-items">0</span>
        </div>

        <div class="summary-row">
            <span>Subtotal</span>
            <span id="sum-subtotal">$0.00</span>
        </div>

        <div class="summary-row" id="discount-row" style="display:none;">
            <span>Discount 10%</span>
            <span id="sum-discount">-$0.00</span>
        </div>

        <div class="summary-row">
            <span>VAT 7%</span>
            <span id="sum-vat">$0.00</span>
        </div>

        <div class="summary-row grand-total">
            <span>Total</span>
            <span id="sum-total">$0.00</span>
        </div>

        <button class="checkout-btn" onclick="checkout()">CHECKOUT</button>
    </div>
</section>

<footer>
    <p>DOLLY PERFUME — Luxury fragrance crafted for timeless elegance.</p>
</footer>

<script>
// ===== PRODUCTS =====
const products = [
["SKIN PERFECTING PROTECTIVE BASE PREP",79,"p1.png"],
["WHOLE PLANT EFFECT ESSENTIAL CREAM",77,"p2.png"],
["CALMING & COMFORTING AMPOULE",50,"p3.png"],
["HYDRATING & SOOTHING CREAM",49,"p4.png"],
["WHOLE PLANT EFFECT CONCENTRATE",88,"p5.png"],
["WHOLE PLANT ESSENTIAL CREAM",99,"p6.png"],
["HYDRATING & SOOTHING MIST",32,"p7.png"],
["CALMING & SOOTHING CREAM",36,"p8.png"],
["HYDRATING & SOOTHING TONER",34,"p9.png"],
["RADIANCE GLOW SERUM",65,"p10.png"],
["PREMIUM NIGHT REPAIR SERUM",120,"p3.png"],
["ULTRA MOISTURE DAY CREAM",95,"p4.png"]
];

// ===== CREATE STOCK TABLE =====
const stockList = document.getElementById("stock-list");
const DEFAULT_STOCK = 10;

products.forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td>${i + 1}</td>
        <td>${p[0]}</td>
        <td>${p[1]}</td>
        <td class="stock">${DEFAULT_STOCK}</td>
        <td><button class="add-btn" onclick="buyItem(this)">ADD</button></td>
    `;
    stockList.appendChild(tr);
});

// ===== CART LOGIC =====
let totalItems = 0;
let subtotal = 0;

function formatMoney(n){
    return n.toLocaleString('en-US',{minimumFractionDigits:2});
}

function buyItem(btn){
    const row = btn.closest('tr');
    const stockCell = row.querySelector('.stock');
    const price = parseFloat(row.cells[2].innerText);
    let stock = parseInt(stockCell.innerText);

    if(stock > 0){
        stockCell.innerText = stock - 1;
        totalItems++;
        subtotal += price;
        calculate();
    }else{
        alert("Out of stock ❌");
    }
}

function calculate(){
    let discount = 0;
    if(totalItems > 5){
        discount = subtotal * 0.1;
        document.getElementById('discount-row').style.display = 'flex';
    }else{
        document.getElementById('discount-row').style.display = 'none';
    }

    const vat = (subtotal - discount) * 0.07;
    const total = subtotal - discount + vat;

    document.getElementById('sum-items').innerText = totalItems;
    document.getElementById('sum-subtotal').innerText = "$" + formatMoney(subtotal);
    document.getElementById('sum-discount').innerText = "-$" + formatMoney(discount);
    document.getElementById('sum-vat').innerText = "$" + formatMoney(vat);
    document.getElementById('sum-total').innerText = "$" + formatMoney(total);
}

function checkout(){
    if(totalItems === 0){
        alert("Cart is empty");
        return;
    }
    alert("Payment successful 💖");
    location.reload();
}
</script>

</body>
</html>
